<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 | Página no encontrada - ENAFOL</title>

    <meta name="description"
        content="La página que buscas no existe o fue movida.">

    <link rel="icon"
        href="assets/images/logo.png">

    <style>

        *{

            margin:0;
            padding:0;
            box-sizing:border-box;

        }

        body{

            font-family:'Poppins',Arial,sans-serif;

            background:#003049;

            color:#fff;

            display:flex;

            justify-content:center;

            align-items:center;

            min-height:100vh;

            text-align:center;

            padding:20px;

        }

        .container{

            max-width:700px;

        }

        img{

            width:170px;

            margin:auto;

            margin-bottom:35px;

        }

        h1{

            font-size:7rem;

            color:#D4A017;

            margin-bottom:10px;

            line-height:1;

        }

        h2{

            font-size:2rem;

            margin-bottom:20px;

        }

        p{

            font-size:1.1rem;

            color:#ddd;

            margin-bottom:40px;

            line-height:1.8;

        }

        a{

            display:inline-block;

            background:#C1121F;

            color:#fff;

            text-decoration:none;

            padding:15px 35px;

            border-radius:50px;

            transition:.3s;

            font-weight:600;

        }

        a:hover{

            background:#a40f1a;

            transform:translateY(-3px);

        }

    </style>

</head>

<body>

    <div class="container">

        <img src="assets/images/logo.png"
            alt="Logo ENAFOL">

        <h1>404</h1>

        <h2>Página no encontrada</h2>

        <p>

            Lo sentimos, la página que intentas visitar no existe,
            fue movida o la dirección es incorrecta.

        </p>

        <a href="index.html">

            Volver al Inicio

        </a>

    </div>

</body>

</html>
